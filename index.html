<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Higher or Lower - Countries</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="text-center mb-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="text-muted mt-2">Carregando países...</p>
      </div>

      <!-- Game Content -->
      <div id="gameContent" style="display: none">
        <h1 class="text-center mb-2">🌍 Higher or Lower</h1>
        <p class="subtitle text-center text-muted">
          Escolha qual país tem maior população
        </p>

        <div
          class="score-board d-flex justify-content-between align-items-center p-2 bg-light rounded"
        >
          <span id="score" class="fs-6 fw-bold">Score: 0</span>
          <button class="btn btn-primary" onclick="resetGame()">
            Novo Jogo
          </button>
        </div>

        <div
          class="game-area d-flex justify-content-center align-items-stretch"
        >
          <div class="country-card">
            <a
              id="detailBtnLeft"
              class="btn btn-outline-secondary btn-sm details-button"
              href="#"
              >Detalhes</a
            >
            <div class="country-header">
              <span class="flag" id="flag1"></span>
              <h2 id="name1"></h2>
            </div>
            <p class="population" id="pop1"></p>
            <button
              class="choice-btn btn btn-primary btn-sm w-100"
              onclick="chooseLeft()"
            >
              ← Esquerda
            </button>
          </div>

          <div
            class="vs fw-bold fs-5 text-primary d-flex align-items-center px-3"
          >
            VS
          </div>

          <div class="country-card">
            <a
              id="detailBtnRight"
              class="btn btn-outline-secondary btn-sm details-button"
              href="#"
              >Detalhes</a
            >
            <div class="country-header">
              <span class="flag" id="flag2"></span>
              <h2 id="name2"></h2>
            </div>
            <p class="population" id="pop2"></p>
            <button
              class="choice-btn btn btn-primary btn-sm w-100"
              onclick="chooseRight()"
            >
              Direita →
            </button>
          </div>
        </div>

        <div id="message" class="message text-center"></div>
        <div class="text-center mt-3">
          <button
            id="nextBtn"
            class="btn btn-success btn-sm"
            onclick="nextRound()"
            style="display: none"
          >
            Próxima Rodada →
          </button>
        </div>

        <div class="mt-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0">Lista de países</h2>
            <span class="text-muted" id="totalCountries">0 países</span>
          </div>
          <p class="text-muted">
            Clique em um país para ver detalhes específicos.
          </p>
          <div id="countryList" class="country-list list-group"></div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
