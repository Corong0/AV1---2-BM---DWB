<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhes do País</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-2">Detalhes do País</h1>
      <p class="subtitle text-center text-muted">
        Informações completas de um país específico
      </p>

      <div id="loadingSpinner" class="text-center mb-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="text-muted mt-2">Buscando dados do país...</p>
      </div>

      <div id="errorMessage" class="error-box" style="display: none"></div>

      <div id="detailsContent" class="details-card" style="display: none">
        <div class="text-center">
          <img
            id="detailFlag"
            src=""
            alt="Bandeira do país"
            style="
              max-width: 180px;
              border-radius: 12px;
              box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            "
          />
        </div>
        <h2 id="detailName" class="text-center mt-3"></h2>
        <div id="detailList" class="details-grid"></div>
        <div class="text-center mt-4">
          <a href="index.html" class="btn btn-secondary">← Voltar</a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/detalhes.js"></script>
  </body>
</html>
